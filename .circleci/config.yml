version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:18.20

    working_directory: ~/circleci-docker-pipeline

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: Run unit tests
          command: npm test

workflows:
  build-test-deploy:
    jobs:
      - test
